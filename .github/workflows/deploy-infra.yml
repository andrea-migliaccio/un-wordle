name: Deploy Azure Infrastructure (Bicep)

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: false  # don't cancel in-flight infra deployments

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: rg-unwordle
          template: infra/main.bicep
          parameters: infra/main.bicepparam
          failOnStdErr: false

      - name: Show Static Web App hostname
        run: |
          echo "SWA default hostname:"
          az staticwebapp show \
            --name swa-unwordle \
            --resource-group rg-unwordle \
            --query defaultHostname -o tsv
