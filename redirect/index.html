<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="5; url=https://unwordle.tinyapps.it" />
  <title>UnWordle — Spostato</title>
  <style>
    :root {
      --bg: #121213;
      --surface: #1a1a1b;
      --border: #3a3a3c;
      --text: #ffffff;
      --subtext: #818384;
      --green: #538d4e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.2rem;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 400px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem 2.5rem;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    p {
      color: var(--subtext);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      letter-spacing: 0.05rem;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .countdown {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--subtext);
    }

    #seconds {
      font-weight: 700;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="logo">UnWordle</div>
  <div class="card">
    <h1>🟩 UnWordle si è spostato!</h1>
    <p>
      UnWordle ha una nuova casa. Trovi il gioco al suo nuovo indirizzo:
    </p>
    <a class="btn" href="https://unwordle.tinyapps.it">
      unwordle.tinyapps.it
    </a>
    <p class="countdown">
      Reindirizzamento automatico tra <span id="seconds">5</span> secondi…
    </p>
  </div>

  <script>
    var s = 5;
    var el = document.getElementById('seconds');
    var t = setInterval(function () {
      s--;
      el.textContent = s;
      if (s <= 0) {
        clearInterval(t);
        window.location.href = 'https://unwordle.tinyapps.it';
      }
    }, 1000);
  </script>
</body>
</html>
